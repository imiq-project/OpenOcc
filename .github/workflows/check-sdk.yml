name: SDK

on:
  push:
  pull_request:

jobs:
  check-sdks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ./vehicle-sdk[dev]

      - name: Run vehicle-sdk CI script
        run: python ./vehicle-sdk/bin/ci.py
