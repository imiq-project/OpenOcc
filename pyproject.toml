[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-wheel"
dynamic = ["version"]
dependencies = [
  "aioquic",
  "aiortc",
  "requests",
]
optional-dependencies = { dev = ["coverage"] }
authors = [
  {name = "Björn Otto", email = "bjoern.otto@ovgu.de"},
]
readme = "README.md"

[tool.setuptools]
packages = ["steering_wheel"]

[tool.setuptools.dynamic]
version = {attr = "steering_wheel.__version__"}


