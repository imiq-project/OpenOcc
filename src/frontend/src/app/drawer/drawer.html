<div class="card flex justify-center">
    <p-drawer [(visible)]="visible">
        <ng-template #header>
            <div class="flex align-items-center gap-2">
                <img src="/static/logo.png" style="width: 64px;">
                <span class="font-bold">OpenOcc</span>
            </div>
        </ng-template>
        <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore
            et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut
            aliquip ex ea commodo consequat.
        </p>
        <ng-template #footer>
            <div class="flex items-center gap-2">
                <button pButton label="Account" icon="pi pi-user" class="w-full" outlined></button>
                <button pButton label="Logout" icon="pi pi-sign-out" class="w-full" severity="danger" text></button>
            </div>
        </ng-template>
    </p-drawer>
    <button pButton (click)="visible = true" icon="pi pi-bars" style="z-index: 1000; position: absolute; left: 8px; top: 80px;"></button>
</div>
