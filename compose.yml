services:
  server:
    build:
      context: src
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./certs:/certs
    environment:
      - EXPRESS_TURN_USERNAME=
      - EXPRESS_TURN_PASSWORD=
    ports:
      - 80:80 # http
      - 443:443/tcp # https
      - 443:443/udp # http/3
